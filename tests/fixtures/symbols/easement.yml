version: 1

components:
  handler:
    in: internal/handlers
  db:
    in: internal/db
    public_symbols: [Scoped, Tx]
    because: handlers get a scoped client, never the raw one

rules:
  handler:
    may_depend_on: [db]
    forbid_symbol:
      - { name: "db.Client", because: use db.Scoped so every query is tenant-bound }
