version: 1

components:
  ports:    { in: Ports }
  adapters: { in: Adapters }
  cache:    { in: Cache }
  sql:      { in: Sql }
  tests:    { in: Tests }

rules:
  ports:
    allow_implementers: [adapters, tests]
    because: ports are implemented only by adapters and test doubles
  adapters: { may_depend_on: [ports] }
  cache:    { may_depend_on: [ports] }
  sql:      { may_depend_on: [adapters] }
  tests:    { may_depend_on: [ports] }
