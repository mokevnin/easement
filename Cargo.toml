[package]
name = "easement"
version = "0.5.2"
edition = "2024"
description = "Architecture quality gate for polyglot codebases"
license = "MIT"
repository = "https://github.com/mokevnin/easement"
homepage = "https://github.com/mokevnin/easement"
readme = "README.md"
keywords = ["architecture", "linter", "dependencies", "quality-gate", "boundaries"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*.rs", "/easement.schema.json", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
dunce = "1.0.5"
globset = "0.4.20"
gomod-parser = "0.6.0"
ignore = "0.4.33"
jsonc-parser = "0.34"
pathfinding = "4.16.0"
protobuf = "3"
quick-junit = "0.8.0"
regex = "1.13.1"
schemars = "1.2.3"
scip = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde-sarif = "0.8.0"
serde_json = "1.0.154"
serde_norway = "0.9.42"
serde_path_to_error = "0.1.20"
similar = "3"
soft-canonicalize = { version = "0.5.6", features = ["dunce"] }
streaming-iterator = "0.1.9"
strsim = "0.11.1"
tempfile = "3.27.0"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.4"
unidiff = { version = "0.4.1", default-features = false }
which = "8.0.6"
yaml-edit = { version = "0.3.6", default-features = false }

[package.metadata.deb]
section = "devel"
priority = "optional"
assets = [
    ["target/release/easement", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/easement/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/easement", dest = "/usr/bin/easement", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/easement/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/easement/README.md", mode = "644", doc = true },
]

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
predicates = "3.1.4"
serde_json = "1.0.154"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
