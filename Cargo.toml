[package]
name = "easement"
version = "0.1.0"
edition = "2024"
description = "Architecture quality gate for polyglot codebases"
license = "MIT"
repository = "https://github.com/mokevnin/easement"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dunce = "1.0.5"
globset = "0.4.20"
ignore = "0.4.33"
oxc_resolver = "11.24.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
streaming-iterator = "0.1.9"
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
