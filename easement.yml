# yaml-language-server: $schema=./easement.schema.json
# easement checks its own code. A new module belongs to no component and fails as
# `orphan` until it is placed here: decide which part of easement it is first.
version: 1

components:
  # The library's root and the files that only declare modules: every `crate::`
  # path names them.
  root: { in: [src/lib.rs, src/lang/mod.rs, src/packages/mod.rs] }
  # The binary: it parses the arguments, prints what the library answers and exits
  # with the code of its outcome. No command decides anything here.
  cli: { in: src/main.rs }
  # The language-agnostic core (AGENTS.md).
  core:
    in: [src/config, src/components.rs, src/check.rs, src/decision.rs, src/baseline.rs, src/diff.rs, src/flow.rs, src/policy.rs, src/scope.rs, src/relpath.rs, src/symbols.rs, src/chains.rs, src/matching.rs, src/implementations.rs]
  # What easement knows of languages and manifests sits in four tiers, each
  # reaching only the ones above it (AGENTS.md). The vocabulary: the model of
  # code, the types of the entries of a language and of a kind of manifest, and
  # what their hooks share (parts, syntax trees, the parsing of a SCIP symbol).
  vocabulary: { in: [src/lang/model.rs, src/lang/syntax.rs, src/lang/language.rs, src/lang/parts.rs, src/packages/manifest.rs, src/scip/symbol.rs] }
  # The code of one language or one kind of manifest: the hooks its entry names.
  language-code: { in: [src/lang/csharp.rs, src/lang/go.rs, src/lang/java.rs, src/lang/kotlin.rs, src/lang/php.rs, src/lang/python.rs, src/lang/ruby.rs, src/lang/rust.rs, src/lang/swift.rs, src/lang/typescript.rs, src/packages/npm.rs, src/packages/go.rs, src/packages/cargo.rs] }
  # The table of entries and the questions asked of it.
  registry: { in: src/lang/registry.rs }
  # What runs the indexers and the adapters and reads their output and the
  # manifests, the same for every language and kind, by asking the registry.
  readers: { in: [src/indexer.rs, src/lang/adapters.rs, src/scip/mod.rs, src/packages/declared.rs, src/packages/entries.rs] }
  # Commands, the scan that feeds them, and the rules that need the whole project.
  commands:
    in:
      - src/commands.rs
      - src/diagram.rs
      - src/doctor.rs
      - src/drift.rs
      - src/examples.rs
      - src/explain.rs
      - src/graph.rs
      - src/impact.rs
      - src/init.rs
      - src/manifests.rs
      - src/patch.rs
      - src/propose.rs
      - src/project.rs
      - src/report.rs
      - src/resolved.rs
      - src/review.rs
      - src/review
      - src/scan.rs
      - src/suggest.rs
      - src/suppress.rs
      - src/unused.rs

common: [root]

rules:
  root: { may_depend_on: [core, vocabulary, language-code, registry, readers, commands] }
  core:
    may_depend_on: [vocabulary, registry]
    # The entry of one language, or one kind of manifest: only the registry and
    # the tests name one; everything else asks a field of the entry of a language
    # or of a kind of manifest (AGENTS.md).
    forbid_symbol: &one_language
      - easement::lang::registry.GO
      - easement::lang::registry.TYPESCRIPT
      - easement::lang::registry.PYTHON
      - easement::lang::registry.JAVA
      - easement::lang::registry.KOTLIN
      - easement::lang::registry.CSHARP
      - easement::lang::registry.PHP
      - easement::lang::registry.SWIFT
      - easement::lang::registry.RUBY
      - easement::lang::registry.RUST
      - easement::lang::registry.PACKAGE_JSON
      - easement::lang::registry.GO_MOD
      - easement::lang::registry.CARGO_TOML
    because: the core is language-agnostic; what differs by language goes through the registry (AGENTS.md)
  vocabulary:
    may_depend_on: [core]
    because: what every language shares never reaches the code of one (AGENTS.md)
  language-code:
    may_depend_on: [core, vocabulary]
    because: the code of a language or of a kind of manifest is reached through its entry, and reaches only what every one shares (AGENTS.md)
  registry: { may_depend_on: [core, vocabulary, language-code] }
  readers:
    may_depend_on: [core, vocabulary, registry]
    forbid_symbol: *one_language
    because: a reader asks the registry what differs by language or kind of manifest, never the code of one (AGENTS.md)
  commands:
    may_depend_on: [core, vocabulary, registry, readers]
    forbid_symbol: *one_language
    because: a rule asks the registry what differs by language and never names one (AGENTS.md)
  cli:
    may_depend_on: [commands, core, readers]
    forbid_symbol: *one_language
    because: the binary only parses, prints and exits; a command's answer comes from `commands` (AGENTS.md)

# What the policy must keep meaning, though no code imports it.
examples:
  - { from: src/config/mod.rs, to: src/indexer.rs, expect: rejected, rule: dependency, because: the core is language-agnostic (AGENTS.md) }
  - { from: src/check.rs, to: src/lang/registry.rs, expect: allowed }
  # The tiers: the code of one language is reached through the registry alone.
  - { from: src/lang/registry.rs, to: src/lang/rust.rs, expect: allowed }
  - { from: src/packages/declared.rs, to: src/packages/cargo.rs, expect: rejected, rule: dependency }
  - { from: src/scip/mod.rs, to: src/lang/typescript.rs, expect: rejected, rule: dependency }
  - { from: src/lang/language.rs, to: src/lang/rust.rs, expect: rejected, rule: dependency }
  - { from: src/lang/rust.rs, to: src/lang/registry.rs, expect: rejected, rule: dependency }

tests: auto
strict: true

# Fixture projects are test data, and commitlint's config is not part of easement.
exclude: ["tests/fixtures/**", commitlint.config.mjs]
