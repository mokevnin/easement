# yaml-language-server: $schema=./easement.schema.json
# easement checks its own code. A new module belongs to no component and fails as
# `orphan` until it is placed here: decide which part of easement it is first.
version: 1

components:
  # The library's root declares every module, and every `crate::` path names it.
  root: { in: src/lib.rs }
  # The binary: it parses the arguments, prints what the library answers and exits
  # with the code of its outcome. No command decides anything here.
  cli: { in: src/main.rs }
  # The language-agnostic core (AGENTS.md).
  core:
    in: [src/config, src/components.rs, src/check.rs, src/decision.rs, src/baseline.rs, src/diff.rs, src/flow.rs, src/policy.rs, src/scope.rs, src/relpath.rs, src/symbols.rs, src/chains.rs, src/matching.rs]
  # What easement knows of each language, as data.
  registry: { in: [src/lang/mod.rs, src/lang/parts.rs, src/lang/registry.rs, src/stdlib.rs] }
  # Code for particular languages: indexers, reading their indexes, adapters, manifests.
  languages: { in: [src/indexer.rs, src/scip, src/lang/go.rs, src/lang/kotlin.rs, src/lang/svelte.rs, src/lang/swift.rs, src/lang/typescript.rs, src/packages] }
  # Commands, the scan that feeds them, and the rules that need the whole project.
  commands:
    in:
      - src/commands.rs
      - src/diagram.rs
      - src/doctor.rs
      - src/examples.rs
      - src/explain.rs
      - src/graph.rs
      - src/impact.rs
      - src/init.rs
      - src/manifests.rs
      - src/patch.rs
      - src/propose.rs
      - src/project.rs
      - src/report.rs
      - src/review.rs
      - src/review
      - src/scan.rs
      - src/suggest.rs
      - src/suppress.rs
      - src/unused.rs

common: [root]

rules:
  root: { may_depend_on: [core, registry, languages, commands] }
  core:
    may_depend_on: [registry]
    # The entry of one language, or one kind of manifest: only the registry, the
    # indexers, the adapters and `packages` name one; everything else asks a field
    # of the entry or a method of `Manifest` (AGENTS.md).
    forbid_symbol: &one_language
      - easement::lang::registry.GO
      - easement::lang::registry.TYPESCRIPT
      - easement::lang::registry.PYTHON
      - easement::lang::registry.JAVA
      - easement::lang::registry.KOTLIN
      - easement::lang::registry.CSHARP
      - easement::lang::registry.PHP
      - easement::lang::registry.SWIFT
      - easement::lang::registry.RUBY
      - easement::lang::registry.RUST
      - easement::lang::registry::Manifest.Npm
      - easement::lang::registry::Manifest.Go
      - easement::lang::registry::Manifest.Cargo
    because: the core is language-agnostic; what differs by language goes through the registry (AGENTS.md)
  registry: { may_depend_on: [core, languages] }
  languages: { may_depend_on: [core, registry] }
  commands:
    may_depend_on: [core, registry, languages]
    forbid_symbol: *one_language
    because: a rule asks the registry what differs by language and never names one (AGENTS.md)
  cli:
    may_depend_on: [commands, core, languages]
    forbid_symbol: *one_language
    because: the binary only parses, prints and exits; a command's answer comes from `commands` (AGENTS.md)

# What the policy must keep meaning, though no code imports it.
examples:
  - { from: src/config/mod.rs, to: src/indexer.rs, expect: rejected, rule: dependency, because: the core is language-agnostic (AGENTS.md) }
  - { from: src/check.rs, to: src/lang/registry.rs, expect: allowed }

tests: auto
strict: true

# Fixture projects are test data, and commitlint's config is not part of easement.
exclude: ["tests/fixtures/**", commitlint.config.mjs]
