# One toolchain for developers, git hooks and CI: `mise install`, then `mise run check`.
[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy,rust-analyzer" }
"aqua:axodotdev/cargo-dist" = "0.34.0"
node = "26"
go = "1.27.4"
# The SCIP indexers easement runs (rust-analyzer is the Rust one) and what they build with;
# the tests need them. scip-php and scip-dotnet are installed by composer and dotnet.
"go:github.com/scip-code/scip-go/cmd/scip-go" = "0.2.9"
# Keep the version in step with package.json, which CI installs it from.
"npm:@sourcegraph/scip-typescript" = "0.6.2"
"npm:@sourcegraph/scip-python" = "0.6.8"
java = "temurin-21"
maven = "3.10.1"
# scip-dotnet, the reason for .NET here, runs on the .NET 10 runtime only: stay on 10 until it moves.
dotnet = "10.0.404"
"github:sourcegraph/scip-java" = "0.14.2"
"github:sourcegraph/scip-ruby" = "scip-ruby-v0.5.1"
# Reads an index an indexer wrote: `scip snapshot` prints each occurrence beside its source line.
"github:scip-code/scip" = "0.10.0"
pnpm = "12.21.0"
hk = { version = "2.13.0", workflow = "release.yml" }
pkl = "0.33.0"
cargo-deny = "0.21.0"
"github:bnjbvr/cargo-machete" = "0.10.1"
# Runs the tests (`cargo nextest run`): a process per test, every test binary at once.
"github:nextest-rs/nextest" = { version = "0.9.152", version_prefix = "cargo-nextest-" }
# Reviews the snapshots of the tests (`cargo insta review`).
cargo-insta = "1.49.0"
jactionlint = { version = "2.6.0", workflow = "release.yaml" }
# Used by jactionlint to check the run: scripts of workflows.
shellcheck = "0.11.0"
# Finds security issues in the GitHub workflows: template injection, leaked credentials, broad permissions.
zizmor = "1.32.0"
betterleaks = "1.10.1"
typos = "1.52.2"
rumdl = "0.3.4"
lychee = "0.24.2"

# Matt Pocock's agent skills: a tagged release of mattpocock/skills, which `mise run skills` copies
# into the project. The tags API lists the newest first and mise takes the last version as the
# latest, so the expression reverses them for `mise upgrade`.
[tools."http:mattpocock-skills"]
version = "1.3.2"
url = "https://github.com/mattpocock/skills/archive/refs/tags/v{{version}}.tar.gz"
version_list_url = "https://api.github.com/repos/mattpocock/skills/tags"
version_expr = 'reverse(map(filter(fromJSON(body), hasPrefix(#.name, "v")), trimPrefix(#.name, "v")))'

# Morgan Linton's Rust agent skills (write, review and port idiomatic Rust): a tagged release of
# morganlinton/BeautifulRust, copied in by `mise run skills` and upgraded like the one above.
[tools."http:beautiful-rust"]
version = "1.6.0"
url = "https://github.com/morganlinton/BeautifulRust/archive/refs/tags/v{{version}}.tar.gz"
version_list_url = "https://api.github.com/repos/morganlinton/BeautifulRust/tags"
version_expr = 'reverse(map(filter(fromJSON(body), hasPrefix(#.name, "v")), trimPrefix(#.name, "v")))'

# Where `composer global require` (macOS, Linux) and `dotnet tool install --global` put
# scip-php and scip-dotnet, which the tests need; the CI workflow shows how to install them.
# Windows has no HOME, so the home directory falls back to USERPROFILE there.
[env]
_.path = [
  '{{ get_env(name="HOME", default=get_env(name="USERPROFILE", default="")) }}/.composer/vendor/bin',
  '{{ get_env(name="HOME", default=get_env(name="USERPROFILE", default="")) }}/.config/composer/vendor/bin',
  '{{ get_env(name="HOME", default=get_env(name="USERPROFILE", default="")) }}/.dotnet/tools',
]

# Resources shipped by the pinned tools (hk, ...): agent skills are linked into .agents/skills and
# kept in sync with the pinned tool versions.
[settings.skills]
auto_sync = true
prune = true

# `mise install` installs the git hooks, so a clone has them without a separate step. hk keeps
# them in .git/config (`hook.hk-*`), shared by every worktree.
[hooks]
postinstall = "hk install"

[tasks.setup]
description = "Install the npm dependencies and the agent skills"
depends = ["skills"]
run = "pnpm install --frozen-lockfile"

# The skills of the mattpocock-skills plugin (its .claude-plugin/plugin.json), without the
# in-progress and misc ones, and the three Rust skills of BeautifulRust, copied from the pinned
# releases into .agents/skills, where Codex reads them and mise links the skills of its tools.
# Claude Code reads .claude/skills, a link to it. Both are gitignored; a copy, not a link, because
# mise prunes the links into its installs it did not make itself.
[tasks.skills]
description = "Copy the agent skills of the pinned releases (Matt Pocock's, BeautifulRust) into the project"
run = """
#!/usr/bin/env bash
set -euo pipefail
src="$(mise where http:mattpocock-skills)/skills"
mkdir -p .agents/skills .claude
for skill in \
  engineering/ask-matt engineering/diagnosing-bugs engineering/grill-with-docs \
  engineering/triage engineering/improve-codebase-architecture \
  engineering/setup-matt-pocock-skills engineering/tdd engineering/to-spec engineering/to-tickets \
  engineering/wayfinder engineering/implement engineering/implement-spec engineering/prototype \
  engineering/research engineering/domain-modeling engineering/codebase-design \
  engineering/code-review engineering/pr engineering/retro engineering/wizard \
  productivity/grill-me productivity/grilling productivity/handoff productivity/teach \
  productivity/to-questionnaire productivity/wait-what productivity/writing-for-agents; do
  name="${skill#*/}"
  rm -rf ".agents/skills/$name"
  cp -R "$src/$skill" ".agents/skills/$name"
done
rust="$(mise where http:beautiful-rust)/skills"
for name in rust-best-practices rust-review rust-port; do
  rm -rf ".agents/skills/$name"
  cp -R "$rust/$name" ".agents/skills/$name"
done
# Earlier installs made .claude/skills a directory of links; it holds nothing else.
if [ -d .claude/skills ] && [ ! -L .claude/skills ]; then
  if [ -n "$(find .claude/skills -mindepth 1 -maxdepth 1 ! -type l)" ]; then
    echo ".claude/skills holds more than links; move its contents into .agents/skills" >&2
    exit 1
  fi
  rm -r .claude/skills
fi
[ -L .claude/skills ] || ln -s ../.agents/skills .claude/skills
"""

[tasks.update]
description = "Update npm and Cargo dependencies; then run `mise run check` and `cargo nextest run`"
depends = ["update:npm", "update:cargo"]

# The SCIP indexers of package.json are pinned to the versions of mise.toml (the tests and CI use
# them); `mise run upgrade` moves both together, so ncu and Dependabot leave them alone.
[tasks."update:npm"]
description = "Bump the npm dev tools (not the SCIP indexers)"
run = "pnpm dlx npm-check-updates -u --reject '@sourcegraph/*' && pnpm install"

[tasks."update:cargo"]
description = "Bump Cargo.toml to the newest releases, breaking ones included, then Cargo.lock"
# cargo-edit has no release binaries: run here only, so that CI, which installs every tool of
# [tools], does not build it.
run = ["mise exec cargo:cargo-edit@0.13.14 -- cargo upgrade --incompatible", "cargo update"]

# --no-global: a bare `mise upgrade` also upgrades every tool of ~/.config/mise/config.toml.
# --bump rewrites the pins of this file, including the two SCIP indexers: copy a moved one into
# package.json, and a moved hk into hk.pkl, in the same commit (CI installs them from there).
# Then the agent skills of the new release are copied in.
[tasks.upgrade]
description = "Upgrade the mise tools pinned in mise.toml, not the global ones, and recopy the agent skills"
run = ["mise upgrade --no-global --bump", "mise run skills"]

[tasks.check]
description = "Run every check, the same set CI runs"
run = "hk check --all"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"

# Mutation tests of the lines changed since origin/main, committed or not: cargo-mutants changes
# the code (a condition flipped, a body replaced) and runs the tests, and a mutant they do not
# catch is code no test pins. Slow, so not part of `check`: an unmutated run of the tests first,
# then a build per mutant and the tests again, which stop at the first failure for a caught
# mutant and run in full for a missed one. The missed ones are listed in
# target/mutants.out/missed.txt. Its own tool, so the CI jobs do not build it.
[tasks.mutants]
description = "Mutation-test the lines changed since origin/main; a missed mutant is code no test pins"
tools = { "cargo:cargo-mutants" = "27.1.0" }
run = """
#!/usr/bin/env bash
set -euo pipefail
mkdir -p target
git diff "$(git merge-base origin/main HEAD)" > target/mutants.diff
cargo mutants --in-diff target/mutants.diff --output target
"""

# How long `easement check` takes on this repository, a release build. `cached` reuses the index
# rust-analyzer wrote, so it times easement's own work: reading the index, the policy and the
# report; `uncached` runs rust-analyzer too (--no-cache). The indexes are kept in target/, apart
# from the user's cache; the tables go to target/bench.md, the numbers to
# target/bench-{cached,uncached}.json. Run it on main and on a branch to compare.
[tasks.bench]
description = "Time `easement check` on this repository, with the index cached and without"
tools = { hyperfine = "2.0.0" }
run = """
#!/usr/bin/env bash
set -euo pipefail
cargo build --release --locked --quiet
export EASEMENT_CACHE_DIR=target/bench-cache
hyperfine --warmup 1 --runs 20 --export-markdown target/bench-cached.md --export-json target/bench-cached.json \
  --command-name cached 'target/release/easement check --format json'
hyperfine --runs 3 --export-markdown target/bench-uncached.md --export-json target/bench-uncached.json \
  --command-name uncached 'target/release/easement check --format json --no-cache'
{ cat target/bench-cached.md; echo; cat target/bench-uncached.md; } > target/bench.md
"""
