# One toolchain for developers, git hooks and CI: `mise install`, then `mise run check`.
[tools]
rust = { version = "1.97.0", components = "rustfmt,clippy,rust-analyzer" }
"aqua:axodotdev/cargo-dist" = "0.33.1"
node = "24"
go = "1.27.3"
# The SCIP indexers easement runs (rust-analyzer is the Rust one) and what they build with;
# the tests need them. scip-php and scip-dotnet are installed by composer and dotnet.
"go:github.com/scip-code/scip-go/cmd/scip-go" = "0.2.9"
# Keep the version in step with package.json, which CI installs it from.
"npm:@sourcegraph/scip-typescript" = "0.5.2"
"npm:@sourcegraph/scip-python" = "0.6.8"
java = "temurin-21"
maven = "3.9.16"
dotnet = "9.0.319"
"github:sourcegraph/scip-java" = "0.13.2"
"github:sourcegraph/scip-ruby" = "scip-ruby-v0.5.1"
pnpm = "12.15.0"
hk = "2.8.1"
pkl = "0.32.2"
cargo-deny = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
jactionlint = "2.3.0"
# Used by jactionlint to check the run: scripts of workflows.
shellcheck = "0.11.0"
betterleaks = "1.9.0"
typos = "1.51.1"
rumdl = "0.3.0"
lychee = "0.24.2"

[tasks.setup]
description = "Install dependencies and the git hooks"
run = ["pnpm install --frozen-lockfile", "hk install"]

[tasks.check]
description = "Run every check, the same set CI runs"
run = "hk check --all"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"
