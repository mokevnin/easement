# Weekly updates for what Dependabot can read: the crate's dependencies, the npm dev tools and the
# actions of the workflows. It cannot read mise.toml: the tools pinned there, the SCIP indexers
# among them, move with `mise run upgrade`. A release waits 7 days before an update proposes it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]

  # The SCIP indexers of package.json are pinned to the versions of mise.toml, which the tests
  # and CI use; they move together with `mise run upgrade`, so they are left out here.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@sourcegraph/*"
    groups:
      npm:
        patterns: ["*"]

  # release.yml is generated by `dist generate` from dist-workspace.toml, never edited by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    exclude-paths:
      - .github/workflows/release.yml
    groups:
      actions:
        patterns: ["*"]
