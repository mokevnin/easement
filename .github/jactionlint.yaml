# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json
ignores:
  - file: .github/workflows/release.yml
    rule: [excessive-permissions, secrets-inherit, template-injection, unverified-download, shellcheck]
    reason: generated by dist from dist-workspace.toml (`dist generate`); never edited by hand
  - file: .github/workflows/publish-crates.yml
    rule: use-trusted-publishing
    reason: crates.io trusted publishing is configured on an existing crate; the first release needs the token
    expires: "2027-01-31"
