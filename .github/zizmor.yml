# release.yml is generated by `dist generate` from dist-workspace.toml and is never edited by hand
# (Dependabot leaves it alone too), so the rules it breaks are ignored there alone; every workflow
# written by hand is held to all of them. Hardening it through dist: #172.
rules:
  unpinned-uses:
    ignore: [release.yml]
  unpinned-images:
    ignore: [release.yml]
  excessive-permissions:
    ignore: [release.yml]
  secrets-inherit:
    ignore: [release.yml]
  template-injection:
    ignore: [release.yml]
  # Until the crate is published through trusted publishing: #169.
  use-trusted-publishing:
    ignore: [publish-crates.yml]
  # The action puts the easement it installed on PATH, for its own step and the steps after it;
  # the directory is $RUNNER_TEMP, which the runner sets, not anything a user writes.
  github-env:
    ignore: [action.yml:38]
