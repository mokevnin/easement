name: Publish crate

# Called by release.yml (a custom publish job of dist) once the GitHub release exists.
on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan of the release
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing: crates.io trades the GitHub OIDC token for a short-lived one.
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # dist gives a custom publish job no contents permission, so the checkout uses a token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          persist-credentials: false

      # No cache: what is published must not come from a restored one.
      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
