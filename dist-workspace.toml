[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# The Homebrew tap the formula is published to (committed by publish-homebrew.yml with RELEASE_PLEASE_TOKEN)
tap = "mokevnin/homebrew-tap"
# release-please creates the (draft) GitHub release; dist uploads to it and undrafts it
create-release = false
# .deb and .rpm packages, built next to the archives and attached to the same release
local-artifacts-jobs = ["./build-linux-packages"]
publish-jobs = ["./publish-homebrew", "./publish-crates"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Build linux arm64 on a native runner; macOS arm64 on macos-15, since
# GitHub retires the macos-14 image dist defaults to on 2026-11-02
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-apple-darwin = "macos-15"

# The actions of release.yml pinned to a commit, the release named beside each; zizmor holds
# the hand-written workflows to the same rule. Dependabot skips release.yml, so a new release
# is pinned here by hand, then `dist generate`.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
