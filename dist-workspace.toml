[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# The Homebrew tap the formula is published to (committed by publish-homebrew.yml with RELEASE_PLEASE_TOKEN)
tap = "mokevnin/homebrew-tap"
# release-please creates the (draft) GitHub release; dist uploads to it and undrafts it
create-release = false
publish-jobs = ["./publish-homebrew", "./publish-crates"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Build linux arm64 on a native runner
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
