# GITHUB_TOKEN is read from the environment, which avoids github.com rate limits.
max_concurrency = 8
max_retries = 3
retry_wait_time = 5
timeout = 30
cache = true
max_cache_age = "1d"
accept = ["200..=204", "429"]
exclude_path = ["node_modules", "target", "CHANGELOG.md"]
# Links into this repository 404 until the commit is pushed.
exclude = ["^https://github.com/mokevnin/easement/"]
