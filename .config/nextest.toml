# The test runner: `cargo nextest run` runs each test in a process of its own, the tests of
# every binary at once. The tests of a run share their indexes (tests/common/mod.rs).

[profile.default]
slow-timeout = { period = "60s" }

# CI: every failure, not the first, and a hung test ends after 10 minutes, not at the job's timeout.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 10 }
